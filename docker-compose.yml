version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL}
    container_name: hashcodesync_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_BETTER_AUTH_URL=${NEXT_PUBLIC_BETTER_AUTH_URL}
      - NEXT_PUBLIC_APP_DOMAIN=${NEXT_PUBLIC_APP_DOMAIN}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
      - CRON_SECRET=${CRON_SECRET}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Africa/Porto-Novo}
      - TZ=${TZ:-Africa/Porto-Novo}
      - HOST=0.0.0.0
      - HOSTNAME=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - hashcodesync_uploads:/app/public/uploads
    networks:
      - hashcodesync_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hashcode-sync.rule=Host(`${NEXT_PUBLIC_APP_DOMAIN}`)"
      - "traefik.http.routers.hashcode-sync.entrypoints=websecure"
      - "traefik.http.routers.hashcode-sync.tls.certresolver=letsencrypt"
      - "traefik.http.services.hashcode-sync.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    container_name: hashcodesync_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hcode_prod_usr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hashcode_sync_db}
    volumes:
      - hashcodesync_postgres:/var/lib/postgresql/data
      - ./postgres/postgresql-custom.conf:/etc/postgresql/postgresql-custom.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql-custom.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcode_prod_usr -d hashcode_sync_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - hashcodesync_net

  backup:
    image: python:3-slim
    container_name: hashcodesync_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - B2_APPLICATION_KEY_ID=${B2_APPLICATION_KEY_ID}
      - B2_APPLICATION_KEY=${B2_APPLICATION_KEY}
      - B2_BUCKET=${B2_BUCKET}
      - B2_ENDPOINT=${B2_ENDPOINT}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS}
      - DATABASE_HOST=db
      - DATABASE_USER=${POSTGRES_USER:-hcode_prod_usr}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB:-hashcode_sync_db}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
      - BACKUP_NOTIFY_EMAIL=${BACKUP_NOTIFY_EMAIL}
      - BACKUP_NOTIFY_DISCORD=${BACKUP_NOTIFY_DISCORD}
      - BACKUP_NOTIFY_EMAIL_ON_SUCCESS=${BACKUP_NOTIFY_EMAIL_ON_SUCCESS}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - hashcodesync_uploads:/backup/uploads:ro
      - ./backup/run.sh:/backup/run.sh:ro
      - ./backup/b2_upload.py:/backup/b2_upload.py:ro
      - ./backup/b2_cleanup.py:/backup/b2_cleanup.py:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update && apt-get install -y postgresql-client cron curl &&
        pip install --no-cache-dir b2sdk &&
        echo "0 2 * * * /backup/run.sh >> /var/log/backup.log 2>&1" | crontab - &&
        touch /var/log/backup.log &&
        cron -f
    networks:
      - hashcodesync_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

volumes:
  hashcodesync_postgres:
  hashcodesync_uploads:

networks:
  hashcodesync_net:
    driver: bridge
  proxy:
    external: true
